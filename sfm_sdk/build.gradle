 apply plugin: 'com.android.library'
// apply plugin: 'com.github.dcendents.android-maven' //included for jitpack

android {
    compileSdkVersion 35


    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 35

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild {
            cmake {
//                arguments "-DANDROID_STL=c++_static" , "-DANDROID_TOOLCHAIN=clang"
                cppFlags "-std=c++11"
            }

        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64', 'x86','armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild{
        cmake{
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
    namespace 'com.supremainc.sfm_sdk'

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.0'
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
